name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (合成資料測試不需 torch)
        run: pip install pandas numpy scipy pyarrow pytest ruff

      - name: Lint (僅檢查會導致執行期錯誤的問題)
        run: ruff check src tests --select E9,F63,F7,F82

      - name: Core logic tests (synthetic data, no real data/ needed)
        run: pytest tests -q
